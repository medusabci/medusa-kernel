name: tests

# CI introduced with K2 (pyproject.toml + uv), extended in K3 (no-extras
# smoke job) and brought to its full shape in K7:
#   - pytest matrix on linux/windows/macos x py3.13 with coverage upload
#     to Codecov and a 30% coverage gate (initial; raise gradually).
#   - dedicated `lint` job running `ruff check .`.
#   - `headless` job kept Linux-only: a bare `pip install` must NOT pull
#     torch, and the non-visual core must import without LOADING Qt
#     (PySide6 is a core dep, so it IS installed — only the heavy GUI stays
#     unloaded). An OS-independent invariant.
#
# Future Python versions (3.14+) plug in by extending the matrix.

on:
  push:
    branches: [ main, developers, "2.0", "2.0-*" ]
  pull_request:
    branches: [ main, developers, "2.0" ]
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Resolve and install (with dev extras)
        run: uv sync --extra dev

      - name: Run tests with coverage
        # Coverage gate is bumped step by step as more tests land. Today
        # (post-K7 close) the real coverage of `medusa.*` is ~15%, after
        # adding band_power, sample_entropy, BCI smoke tests and basic
        # frequency/spatial filtering smoke tests. ~12 % of the
        # uncovered lines belong to `widgets/*` (the Qt GUI, exercised in
        # dedicated offscreen GUI tests, not in this coverage run). Next
        # steps to keep raising the gate without
        # padding it: cross-version recording schema (K6), a real LZC
        # test once the Cython port lands (K4), and unit tests for the
        # heavy metrics in `signal/metrics/connectivity` and
        # `signal/spatial_filtering` (CSP / ICA branches).
        # Target: 30 % short term, 50 % by the 2.0 release.
        run: >
          uv run pytest
          --cov=medusa
          --cov-report=xml
          --cov-report=term
          --cov-fail-under=15
          -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: ${{ matrix.os }}
          fail_ci_if_error: false
        # Public repo: no token required.

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Resolve and install (with dev extras)
        run: uv sync --extra dev

      # Blocking K9 gate: the layers K9 has brought to standard (signal/ and
      # graph/) must stay clean, including the A (no-builtin-shadowing) and
      # ANN (PEP 484 annotations) rules. New regressions there fail CI.
      - name: Run ruff (K9-enforced layers, blocking)
        run: uv run ruff check --select A,ANN src/medusa/signal src/medusa/graph

      # Advisory whole-repo lint: the legacy layers still carry hundreds of
      # pre-K2 findings (long lines, unsorted imports, …) plus un-annotated
      # internals. The count is visible and trending; this step does not fail
      # CI until those layers are cleaned (then drop continue-on-error).
      # Tracked under K9 Phase 6 / K7.
      - name: Run ruff (whole repo, advisory)
        continue-on-error: true
        run: uv run ruff check .

  headless:
    name: headless smoke (linux, py3.13, core only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Contract: a bare `pip install medusa-kernel` (core only) must yield a
    # fully usable, importable core. PySide6 is a CORE dependency (so it IS
    # installed), but the non-visual core (core / signal / ml / graph) must
    # not LOAD Qt at import — only `medusa.widgets` pulls the GUI. PyTorch is
    # NOT a dependency: users install it themselves following
    # https://pytorch.org/get-started/. This job enforces that torch does not
    # leak in and that the headless import surface stays Qt-light.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install kernel without any extras
        # Use plain pip (not uv) so we get a clean, no-lockfile install
        # that mirrors what an external `pip install medusa-kernel` user
        # would experience (medusa-style resolves from PyPI like any other
        # dependency). Install pytest separately so it does not pull in the
        # `[dev]` extra.
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pytest

      - name: Verify torch is NOT installed (PySide6 IS — it is core)
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("torch") is None, (
              "torch unexpectedly installed in the headless job; it is not a "
              "dependency (users install it themselves)."
          )
          assert importlib.util.find_spec("PySide6") is not None, (
              "PySide6 missing; it is now a core dependency of medusa-kernel."
          )
          print("OK: torch absent; PySide6 present (core).")
          PY

      - name: Run headless import tests
        run: pytest tests/test_headless_imports.py -q





