[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# -----------------------------------------------------------------------------
# Project metadata (PEP 621)
# -----------------------------------------------------------------------------
[project]
name = "medusa-kernel"
version = "2.0.0.dev0"
description = "Advanced biosignal processing toolbox — core of the MEDUSA© ecosystem"
readme = "README.md"
requires-python = ">=3.13"
# PEP 639: SPDX license expression. The legal text lives in LICENSE
# (Apache 2.0), and the attribution / NOTICE file is shipped alongside.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["Signal", "Biosignal", "EEG", "BCI", "Neuroscience", "Neurotechnology"]
authors = [
    { name = "Eduardo Santamaría-Vázquez", email = "support@medusabci.com" },
    { name = "Víctor Martínez-Cagigal" },
    { name = "Diego Marcos-Martínez" },
    { name = "Víctor Rodríguez-González" },
    { name = "Sergio Pérez-Velasco" },
]
maintainers = [
    { name = "MEDUSA©", email = "support@medusabci.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

# Core runtime dependencies. Notes (see TODO K3):
# - matplotlib: intentionally core (small, pervasive across `plots/` and
#   several `pipelines/` modules). Treating it as optional would force
#   late-import boilerplate everywhere.
# - bson, dill: kept as core. Both are tiny pure-Python packages (<1 MB
#   each) that back `medusa.core.serialization` (`SerializableComponent`
#   bson/json/mat formats; `PickleableComponent` dill format).
#   `Recording.load()` + the .rec.* file format depend on them, so making
#   them optional would push every consumer to install the same extra
#   anyway. Re-evaluate only if a strictly JSON-only path is desired.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "h5py>=3.9",
    "tqdm>=4.65",
    "rich>=13",
    "PyWavelets>=1.4",
    "bson>=0.5",
    "dill>=0.3.7",
    "PySide6>=6.5",
    "medusa-style>=0.3",
]

[project.urls]
Homepage = "https://medusabci.com/"
Documentation = "https://medusabci.github.io/medusa-kernel/"
Repository = "https://github.com/medusabci/medusa-kernel"
Issues = "https://github.com/medusabci/medusa-kernel/issues"

# -----------------------------------------------------------------------------
# Optional dependencies (extras) — see TODO K3
# -----------------------------------------------------------------------------
#
# Note on PyTorch: there is *intentionally* no `[torch]` extra. PyTorch's
# wheel selection depends on the user's CUDA / ROCm / MPS / CPU stack, the
# vendor index URL, the GPU driver version, and (on Linux) the glibc /
# manylinux flavor. Pulling `torch` from PyPI through an extra would silently
# install the wrong build for many users (e.g. a CPU-only wheel on a CUDA
# box, or a CUDA build that does not match the installed driver). Instead,
# the user is expected to install and configure PyTorch themselves following
# https://pytorch.org/get-started/. `medusa.ml.deep_learning` then imports
# `torch` lazily and `medusa.ml.pytorch_utils` raises
# ``TorchExtrasNotInstalled`` (pointing to the official install page) when
# the user tries to use a torch-backed feature without having installed it.
[project.optional-dependencies]
# Developer tooling: tests, linting, typing.
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-benchmark>=4.0",
    "ruff>=0.5",
    "mypy>=1.8",
]
# Documentation toolchain (MkDocs Material + mkdocstrings + mike). See K10.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-jupyter>=0.25",
    "mike>=2.1",
]
# Convenience aggregator (does NOT include torch — see note above). PySide6 is
# now a core dependency, so there is no separate ``widgets`` extra.
all = [
    "medusa-kernel[dev,docs]",
]

# -----------------------------------------------------------------------------
# Build backend (Hatchling) — src-layout
# -----------------------------------------------------------------------------
# The package lives under `src/medusa/` (PEP 8 / PyPA-recommended src-layout).
# This guarantees that `import medusa` always resolves to the *installed*
# package, never to the working copy on disk — preventing the "tests pass
# locally but fail after install" class of bugs.
[tool.hatch.build.targets.wheel]
packages = ["src/medusa"]
# Exclude developer-only / platform-specific assets from the published wheel.
# (Patterns are matched against project-root-relative paths, hence the
# `src/medusa/...` prefix even though the wheel itself ships them under
# `medusa/...`.)
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/medusa/**",
    "README.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
]
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
]

# Package data (TSV channel maps, .ui files, icons) is included automatically
# by hatchling because it lives inside the `src/medusa/` package tree and is
# not excluded above. K1 (reorg) will move these assets under their new homes
# (`core/data/biosignals/eeg/*.tsv`, `widgets/time_plot/icons/*.png`, ...);
# no extra config will be needed because they will still live inside
# `src/medusa/`.

# -----------------------------------------------------------------------------
# uv configuration
# -----------------------------------------------------------------------------
[tool.uv]
# Lockfile uv.lock is committed; it is the single source of truth for CI
# and for medusa-installer's resolution of medusa-platform's environment.
managed = true

# -----------------------------------------------------------------------------
# Tool configurations
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# `--import-mode=importlib` is required for src-layout: it prevents pytest
# from injecting `cwd` into sys.path (which would otherwise let tests import
# the source tree directly and bypass the installed package, defeating the
# whole point of src-layout).
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    # K7: do not run perf benchmarks by default — opt in with
    # `pytest -m benchmark` or `--benchmark-only`.
    "-m",
    "not benchmark",
]
markers = [
    "benchmark: performance/regression benchmarks (opt-in, slow)",
    "torch: requires a user-installed PyTorch (see https://pytorch.org/get-started/); auto-skipped otherwise",
]

[tool.ruff]
line-length = 80
target-version = "py313"
extend-exclude = [
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "A",   # flake8-builtins — no shadowing builtins (K9.C)
    "ANN", # flake8-annotations — PEP 484 on public defs (K9.A)
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

# K9 scoping: the `A` (builtin-shadowing) and `ANN` (annotation) rules are
# enforced only on the layers K9 has brought to standard — `signal/` and
# `graph/`. The remaining layers are annotated in later phases; until then
# `A`/`ANN` there would be pure noise, so they are ignored per-directory.
# Remove an entry once its layer reaches the K9 standard. The general
# E/F/I/W/UP set still applies everywhere. See TODO.md K9 Phase 6.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "A"]
"src/medusa/core/**" = ["ANN", "A"]
"src/medusa/plots/**" = ["ANN", "A"]
"src/medusa/widgets/**" = ["ANN", "A"]
"src/medusa/ml/**" = ["ANN", "A"]
"src/medusa/pipelines/**" = ["ANN", "A"]

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
# Start permissive; tighten in K7.
check_untyped_defs = false


